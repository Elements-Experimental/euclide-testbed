name: elements-impact
version: 1
description: Elements Impact workflow - enforces Given/When/Then scenarios, Out of scope sections, numbered tasks with AC references, and ADR links in design docs
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **GIVEN** user has data to export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: research
    generates: research.md
    description: Codebase investigation — existing patterns, integration points, reusable assets, and risks with confidence levels
    template: research.md
    instruction: >
      Investigate the codebase and produce research.md before design work begins.
      Follow the openspec-research skill methodology: read proposal and specs to
      understand scope, then systematically investigate for existing patterns,
      integration points, reusable assets, and risks. Classify every finding as
      Confident / Likely / Unclear and cite a file path as evidence. For greenfield
      or new-technology changes, also investigate ecosystem patterns via WebSearch
      and WebFetch, citing URLs. Output is consumed by design.md.
    requires:
      - specs
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation, specs for requirements, and
      research.md for codebase evidence.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
      - research
      - specs
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Each task MUST include four sub-fields on indented lines below the
      checkbox:

      - **Files**: Exact file paths to create or modify (from research.md for
      existing files; for new files, specify the intended path following project
      conventions — do not invent arbitrary paths)

      - **Action**: What to do — specific enough that another agent can
      execute it without re-reading everything

      - **Verify**: How to confirm this task is done (command, visual check,
      or test assertion)

      - **Done**: The observable acceptance criterion — what "done" looks like


      **Specificity test:** If Files is empty or Action says only "implement X", the task is too vague. Rewrite until you could hand it to a fresh agent with no other context and they'd know exactly what to do.


      Guidelines:

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description _(AC: spec.md § <section>)_`

      - Tasks should be small enough to complete in one session

      - Order tasks by dependency (what must be done first?)

      - Reference research.md for file paths and integration points

      - Tasks come first; GitHub Issues are derived from tasks, not the other
      way around. Do not suggest creating issues before tasks exist.


      Example:

      ```

      ## 1. Setup


      - [ ] 1.1 Create data export module _(AC: specs/data-export/spec.md § Export Requirements)_
        - **Files**: `src/lib/export.ts` (new), `src/lib/index.ts` (add export)
        - **Action**: Create `exportToCSV(rows: Row[]): string` function using
          existing `Row` type from `src/types/data.ts`. Add named export in index.
        - **Verify**: `tsc --noEmit` passes; unit test in `src/lib/export.test.ts` passes
        - **Done**: `exportToCSV` callable from any module; returns valid CSV string

      ```


      Reference specs for what needs to be built, research.md for file paths

      and patterns, design for architectural decisions.

      Each task should be verifiable — you know exactly when it's done.
    requires:
      - specs
      - design
      - research
  - id: protocol
    generates: protocol.md
    description: Step-by-step test protocol with human checkpoints for developer verification
    template: protocol.md
    instruction: >
      Write a test protocol that walks a developer through verifying the implementation manually.


      **Automation-first principle**: Reserve `<!-- HUMAN CHECKPOINT -->` steps
      for things that genuinely require human judgment — visual rendering,
      interactive UX, auth flows, external services. Automated checks (tests,
      lint, type checking) are run by the walk command before the human
      walkthrough begins; do not include them as manual steps.


      Guidelines:

      - Group steps by feature area under ## numbered headings

      - Use `<!-- HUMAN CHECKPOINT -->` only for steps requiring human
      judgment or observation — not for things the agent can verify
      automatically

      - Each step should include a `- **Built**: <!-- one sentence: what
      the agent implemented for this step -->` line before the action, so
      the developer has context for why they're checking it

      - Steps should be concrete actions (e.g. "Navigate to screen X",
      "Click button Y")

      - Each step MUST include an **Expected** line describing what should
      happen

      - Reference the relevant spec scenarios (e.g. `_(AC:
      specs/feature/spec.md § Scenario: X)_`) where applicable

      - Order steps from setup through core flows to edge cases

      - Use `- [ ]` checkboxes so the walk command can track progress


      This protocol is used by the developer with `/opsx:walk` after
      implementation. Agents should NOT mark steps as done — that is for
      the human developer.
    requires:
      - tasks
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    After all tasks are complete, write protocol.md using the protocol artifact template.
    Then open a draft PR to the feat/ branch.
    Pause if you hit blockers or need clarification.
