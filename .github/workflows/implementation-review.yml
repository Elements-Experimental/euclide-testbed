name: Implementation Review

on:
  pull_request:
    types: [opened]
    branches:
      - 'feat/**'

jobs:
  request-review:
    # Only run for implementation PRs — not spec PRs (which have title starting with "spec:")
    if: "!startsWith(github.event.pull_request.title, 'spec:')"
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Request Copilot code review
        id: copilot_review
        run: |
          # Attempt to add Copilot as a reviewer via the REST API
          if gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            --method POST \
            --field 'reviewers[]=copilot' 2>/dev/null; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post guidance comment
        run: |
          COPILOT_REQUESTED="${{ steps.copilot_review.outputs.requested }}"

          if [ "$COPILOT_REQUESTED" = "true" ]; then
            REVIEW_LINE="A **Copilot code review** has been requested automatically."
          else
            REVIEW_LINE="Consider requesting a **Copilot code review** or assign a human reviewer."
          fi

          printf -v BODY '%b' \
            "## Implementation ready for review\n\n" \
            "${REVIEW_LINE}\n\n" \
            "**Next steps for the developer:**\n" \
            "1. Address any review comments\n" \
            "2. Pull the branch locally and run \`/opsx:walk\` to step through the test protocol with human checkpoints\n" \
            "3. After all protocol steps pass, run \`/opsx:ship\` to squash commits, archive the change, and open the final PR"

          gh pr comment "$PR_NUMBER" --body "$BODY"
