<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #1e3a5f 50%, #2d1b69 100%);
            font-family: Arial, sans-serif;
            position: relative;
        }

        h1 {
            color: #fff9e6;
            font-size: 4rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 249, 230, 0.5);
            margin: 0;
            position: relative;
            z-index: 1;
        }

        #lamp-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(
                circle 250px at var(--mouse-x, -9999px) var(--mouse-y, -9999px),
                rgba(200, 220, 255, 0.15) 0%,
                rgba(100, 140, 200, 0.1) 30%,
                rgba(50, 70, 120, 0.05) 60%,
                transparent 100%
            );
            opacity: 1;
        }

        #lamp-overlay.hide-lamp {
            background: rgba(10, 25, 47, 0.5);
        }
    </style>
</head>
<body>
    <div id="lamp-overlay" class="hide-lamp"></div>
    <h1>Hello World</h1>
    <script>
        const overlay = document.getElementById('lamp-overlay');

        document.addEventListener('mousemove', (e) => {
            overlay.style.setProperty('--mouse-x', e.clientX + 'px');
            overlay.style.setProperty('--mouse-y', e.clientY + 'px');
            overlay.classList.remove('hide-lamp');
        });

        document.addEventListener('mouseleave', () => {
            overlay.classList.add('hide-lamp');
        });
    </script>
</body>
</html>
